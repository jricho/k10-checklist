apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k10-checklist

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/name: k10-checklist
  app.kubernetes.io/part-of: k10-checklist

# Override the tag at deploy time, e.g.:
#   kustomize edit set image docker.io/jricho/k10-checklist=docker.io/jricho/k10-checklist:v0.1.0
images:
  - name: docker.io/jricho/k10-checklist
    newTag: latest
